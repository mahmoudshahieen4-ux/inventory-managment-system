name: 'Release'

# Triggered when you push a tag like v1.0.0, v1.2.3, etc.
# Or manually from the Actions tab on GitHub
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.2.0)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  release-windows:
    name: Build & Release (Windows x64)
    runs-on: windows-latest
    permissions:
      contents: write # needed to create GitHub releases

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Pin to a stable LTS (Node 20) — 'lts/*' resolves to Node 24 and
          # causes native toolchain/ABI warnings during the Tauri build.
          node-version: '20'
          cache: 'pnpm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # Cache Cargo registry + build artifacts to speed up subsequent builds
      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # tauri-action builds the app, signs the updater payload with your
      # private key, creates the GitHub release, and attaches all artifacts
      # including the generated latest.json update manifest automatically.
      - name: Build, sign & publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Store your private key as a GitHub Secret named TAURI_PRIVATE_KEY
          # and the password as TAURI_KEY_PASSWORD
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name || inputs.version }}
          releaseName: 'Inventory POS System ${{ github.ref_name || inputs.version }}'
          releaseBody: |
            ## ما الجديد في هذا الإصدار؟

            ### تثبيت جديد
            - **Windows**: حمّل ملف `inventory-pos-system_x.x.x_x64-setup.exe` وشغّله

            ### تحديث تلقائي
            المستخدمون الحاليون سيتلقون إشعار التحديث تلقائياً عند فتح التطبيق.

            ---
            **سجل التغييرات الكامل**: https://github.com/${{ github.repository }}/commits/${{ github.ref_name || inputs.version }}
          releaseDraft: false
          prerelease: false
          # Generates latest.json and attaches it to the release automatically
          includeUpdaterJson: true
          args: '--bundles nsis'
